{% extends "base.html" %}

{% block content %}
    <h1 class="my-5">These are the notes</h1>
    <div class="row row-cols-3 g-2">
        {% for note in notes %}
        <div class="col">
            <div class="p-3 border">
                <a href="{%  url 'notes.detail' pk=note.id %}" class="text-dark text-decoration-none">
                    <h3>{{ note.title }}</h3>
                </a>
                {{ note.text | truncatechars:10 }}

            </div>
        </div>
        {% endfor %}
    </div>
    <form id="logout-form" method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" style="background:none; border:none; padding:0; cursor:pointer; text-decoration:underline;">
        Log out
    </button>
</form>
{% endblock %}
